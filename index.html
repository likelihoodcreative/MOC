<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ripple Rings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: working canvas on the left, a narrow control rail on the right; stacks on phones */
:root{
  /* brand: 012C42 navy, FFFFFF, 000000, C96763 rose, 00BFFF sky */
  --bg:#f4f7f9; --panel:#FFFFFF; --fg:#000000; --muted:#4a6474; --line:#d3dde3;
  --accent:#00BFFF; --accent-fg:#000000; --stage:#012C42; --rose:#C96763;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#012C42; --fg:#FFFFFF; --muted:#9fb6c3; --line:#0f4a68;
  --accent:#00BFFF; --accent-fg:#000000; --stage:#011c2b; --rose:#C96763; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#012C42; --fg:#FFFFFF; --muted:#9fb6c3; --line:#0f4a68;
  --accent:#00BFFF; --accent-fg:#000000; --stage:#011c2b; --rose:#C96763; color-scheme:dark }

html,body{margin:0;height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;box-sizing:border-box}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;max-width:1400px;margin:0 auto;min-height:100%}
@media (max-width:820px){.app{grid-template-columns:1fr}canvas{max-height:70vh}}

.stage{background:var(--stage);border-radius:10px;display:flex;align-items:center;justify-content:center;
  padding:20px;min-height:360px;position:relative;min-width:0;box-sizing:border-box}
@media (min-width:821px){.stage{position:sticky;top:16px;align-self:start;height:calc(100vh - 32px)}}
.stage.drag{outline:2px dashed var(--rose);outline-offset:-8px}
canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;cursor:crosshair;touch-action:none;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.12)}
.hint{position:absolute;left:20px;bottom:12px;font-size:12px;color:#9fb6c3}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}

.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px;align-self:start}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.45}
.group{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ctl{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row label{font-weight:500}
.val{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ctl.off{opacity:.4}
.ctl.off .lock{opacity:1}
.lock{font-size:11px}
.ctl.off input{cursor:not-allowed}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:7px 8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--stage);color:#FFFFFF}
.btn{text-decoration:none;font:inherit;font-weight:500;border-radius:7px;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.overlay{position:fixed;inset:0;background:rgba(10,10,12,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.sheet{background:var(--panel);color:var(--fg);border-radius:10px;padding:16px;max-width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
.sheet img{max-height:70vh;object-fit:contain;border-radius:4px}
.sheet p{margin:0;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">Drag on the image to move the centre · drop an image anywhere</div>
  </div>

  <aside class="rail">
    <div>
      <h1>Ripple Rings</h1>
      <p class="sub">Each ring outward shows the image magnified one step further around the centre point.</p>
    </div>

    <div class="btns">
      <label class="btn primary" for="file">Upload image<input id="file" type="file" accept="image/*" hidden></label>
      <button class="btn" id="exportBtn" type="button">Download PNG</button>
    </div>

    <div class="group">
      <span class="label">Rings</span>
      <div class="ctl"><div class="row"><label for="rings">Ring count</label><span class="val" id="ringsV"></span></div>
        <input id="rings" type="range" min="1" max="24" step="1" value="6"></div>
      <div class="ctl"><div class="row"><label for="centre">Centre size</label><span class="val" id="centreV"></span></div>
        <input id="centre" type="range" min="0.02" max="0.9" step="0.01" value="0.2"></div>
      <div class="ctl"><div class="row"><label for="scale">Scale increase per ring</label><span class="val" id="scaleV"></span></div>
        <input id="scale" type="range" min="0" max="150" step="1" value="15">
        <div class="row"><span class="val">Centre 100%</span><span class="val" id="outerV"></span></div></div>
      <div class="ctl"><div class="row"><label for="reach">Outer reach</label><span class="val" id="reachV"></span></div>
        <input id="reach" type="range" min="0.2" max="1" step="0.01" value="1"></div>
      <div class="ctl" id="growCtl"><div class="row"><label for="grow">Ring width increase</label><span class="val" id="growV"></span></div>
        <input id="grow" type="range" min="0" max="50" step="0.5" value="10">
        <span class="val lock" id="growLock" hidden></span></div>
      <div class="ctl"><div class="row"><label for="twist">Twist per ring</label><span class="val" id="twistV"></span></div>
        <input id="twist" type="range" min="-30" max="30" step="0.5" value="0"></div>
    </div>

    <div class="group">
      <span class="label">Fade</span>
      <div class="ctl"><div class="row"><label for="fade">Outer ring opacity</label><span class="val" id="fadeV"></span></div>
        <input id="fade" type="range" min="0" max="100" step="1" value="100">
        <div class="row"><span class="val">Centre 100%</span><span class="val">Fades into fill colour</span></div></div>
    </div>

    <div class="group">
      <span class="label">Pixelate</span>
      <div class="ctl"><div class="row"><label for="pix">Centre strength</label><span class="val" id="pixV"></span></div>
        <input id="pix" type="range" min="0" max="40" step="0.5" value="0"></div>
      <div class="ctl"><div class="row"><label for="pixInc">Increase per ring</label><span class="val" id="pixIncV"></span></div>
        <input id="pixInc" type="range" min="0" max="40" step="0.5" value="0"></div>
    </div>

    <div class="group">
      <span class="label">Blur</span>
      <div class="ctl"><div class="row"><label for="blur">Centre strength</label><span class="val" id="blurV"></span></div>
        <input id="blur" type="range" min="0" max="40" step="0.5" value="0"></div>
      <div class="ctl"><div class="row"><label for="blurInc">Increase per ring</label><span class="val" id="blurIncV"></span></div>
        <input id="blurInc" type="range" min="0" max="20" step="0.25" value="0"></div>
    </div>

    <div class="group">
      <span class="label">Line</span>
      <div class="seg" role="group" aria-label="Ring line style">
        <button type="button" id="styCircle" aria-pressed="false">Circles</button>
        <button type="button" id="styArcs" aria-pressed="true">Logo</button>
      </div>
      <div class="ctl" id="arcCtl"><div class="row"><label for="arcRot">Arc rotation</label><span class="val" id="arcRotV"></span></div>
        <input id="arcRot" type="range" min="0" max="360" step="1" value="0"></div>
      <div id="lineCtl" class="group" style="border:0;padding:0">
      <div class="ctl" id="strokeCtl"><div class="row"><label for="stroke">Ring line weight</label><span class="val" id="strokeV"></span></div>
        <input id="stroke" type="range" min="0" max="40" step="0.5" value="0">
        <span class="val lock" id="strokeLock" hidden></span></div>
      <div class="inline"><input id="strokeCol" type="color" value="#ffffff" aria-label="Ring line colour"><span class="val">Line colour</span></div>
      <div class="sw" data-for="strokeCol"><button type="button" data-c="#012C42" style="background:#012C42" aria-label="#012C42"></button><button type="button" data-c="#FFFFFF" style="background:#FFFFFF" aria-label="#FFFFFF"></button><button type="button" data-c="#000000" style="background:#000000" aria-label="#000000"></button><button type="button" data-c="#C96763" style="background:#C96763" aria-label="#C96763"></button><button type="button" data-c="#00BFFF" style="background:#00BFFF" aria-label="#00BFFF"></button></div>
      </div>
    </div>

    <div class="group">
      <span class="label">Outside the rings</span>
      <div class="seg" id="outSeg" role="group" aria-label="Outside the rings">
        <button type="button" id="outImg" aria-pressed="true">Outer ring</button>
        <button type="button" id="outCol" aria-pressed="false">Colour</button>
      </div>
      <div class="inline"><input id="bgCol" type="color" value="#012c42" aria-label="Outside colour"><span class="val">Fill colour</span></div>
      <div class="sw" data-for="bgCol"><button type="button" data-c="#012C42" style="background:#012C42" aria-label="#012C42"></button><button type="button" data-c="#FFFFFF" style="background:#FFFFFF" aria-label="#FFFFFF"></button><button type="button" data-c="#000000" style="background:#000000" aria-label="#000000"></button><button type="button" data-c="#C96763" style="background:#C96763" aria-label="#C96763"></button><button type="button" data-c="#00BFFF" style="background:#00BFFF" aria-label="#00BFFF"></button></div>
      <button class="btn" id="recentre" type="button">Recentre</button>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <img id="outImgEl" alt="Exported ripple image">
    <a class="btn primary" id="dl" download="ripple-rings.png" href="#">Download PNG</a>
    <button class="btn" id="closeOv" type="button">Close</button>
  </div>
</div>

function setImage(i){
  img = i;
  let w = i.naturalWidth, h = i.naturalHeight, k = Math.min(1, MAX/Math.max(w,h));

  draw();

const off = document.createElement('canvas'), octx = off.getContext('2d');
// canvas blur filter is missing in some older Safari versions; fall back to a soft downscale there
const HAS_FILTER = (() => { const t = document.createElement('canvas').getContext('2d'); t.filter = 'blur(1px)'; return t.filter === 'blur(1px)'; })();
function drawScaled(src, s, rot, px, bl){
  const W = cv.width, H = cv.height, fx = S.fx*W, fy = S.fy*H;
  bl = bl > 0.25 ? bl : 0;
  let soft = false;
  if(bl && !HAS_FILTER && (!px || px < 1.5)){ px = Math.max(1.5, bl); soft = true; bl = 0; }
  if(!px || px < 1.5){
    ctx.save();
    if(bl) ctx.filter = 'blur(' + bl + 'px)';
    ctx.translate(fx,fy); ctx.rotate(rot); ctx.scale(s,s); ctx.translate(-fx,-fy);
    ctx.drawImage(src,0,0,W,H);
    ctx.restore();
    return;
  }
  // render small, then blow up with smoothing off to get hard pixel blocks
  const ow = Math.max(1, Math.ceil(W/px)), oh = Math.max(1, Math.ceil(H/px));
  off.width = ow; off.height = oh;
  octx.setTransform(1,0,0,1,0,0);
  octx.scale(1/px, 1/px);
  octx.translate(fx,fy); octx.rotate(rot); octx.scale(s,s); octx.translate(-fx,-fy);
  octx.imageSmoothingEnabled = true;
  octx.drawImage(src,0,0,W,H);
  ctx.save();
  ctx.imageSmoothingEnabled = soft;
  if(bl && HAS_FILTER) ctx.filter = 'blur(' + bl + 'px)';
  ctx.drawImage(off, 0, 0, ow*px, oh*px);
  ctx.restore();
}

// arc segments traced from the logo, innermost ring first (degrees, clockwise from 3 o'clock); repeats past ring 6
const ARCS = [
  [[259.3,541.8]],
  [[145.3,471.7]],
  [[38.9,360.1]],
  [[128.1,304.9],[329.1,457.9]],
  [[58.5,179.5],[212.5,375.5]],
  [[162.2,267.9],[300.2,476.9]]
];
// a thick arc with round ends, as a fillable outline (r = centre radius, h = half thickness)
function arcShape(path, cx, cy, r, h, a0, a1){
  const ri = Math.max(0.5, r-h), C = Math.cos, Sn = Math.sin;
  path.moveTo(cx+(r+h)*C(a0), cy+(r+h)*Sn(a0));
  path.arc(cx, cy, r+h, a0, a1, false);
  path.arc(cx+r*C(a1), cy+r*Sn(a1), h, a1, a1+Math.PI, false);
  path.arc(cx, cy, ri, a1, a0, true);
  path.arc(cx+r*C(a0), cy+r*Sn(a0), h, a0+Math.PI, a0+2*Math.PI, false);
  path.closePath();
}
function draw(){
  if(!img) return;
  const W = cv.width, H = cv.height, fx = S.fx*W, fy = S.fy*H;
  const far = Math.max(Math.hypot(fx,fy),Math.hypot(W-fx,fy),Math.hypot(fx,H-fy),Math.hypot(W-fx,H-fy));
  const R = far*S.reach, N = S.rings, tw = S.twist*Math.PI/180;
  const r0 = R*S.centre;
  // bands outside the centre each get (1+grow) times wider than the one inside, scaled to fill r0..R
  const g = 1 + S.grow/100, bands = N-1;
  const total = bands>0 ? (g===1 ? bands : (Math.pow(g,bands)-1)/(g-1)) : 1;
  const radius = k => {
    if(k<=1 || bands===0) return r0;
    const j = k-1, sum = g===1 ? j : (Math.pow(g,j)-1)/(g-1);
    return r0 + (R-r0)*sum/total;
  };
  const outerScale = Math.pow(1+S.scale/100, N-1);
  const unit = Math.max(W,H)/1200;
  const px = k => (S.pix + S.pixInc*(k-1))*unit;
  const blurAt = k => (S.blur + S.blurInc*(k-1))*unit;
  const layer = (k, s, rot) => {
    ctx.globalAlpha = alpha(k); drawScaled(img, s, rot, px(k), blurAt(k));
  };
  const alpha = k => N===1 ? S.fade/100 : 1 - (1 - S.fade/100)*(k-1)/(N-1);
  const lw = S.stroke * (Math.max(W,H)/1200);

  $('outerV').textContent = 'Outer ring ' + Math.round(100*Math.pow(1+S.scale/100,N-1)) + '%';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = S.bgCol; ctx.fillRect(0,0,W,H);

  if(S.ringStyle==='arcs'){
    // logo mode: the image only shows inside the shapes. Shape 1 is the centre dot, shapes 2..N are the arcs.
    for(let k=1;k<=N;k++){
      const path = new Path2D();
      if(k===1){ path.arc(fx,fy,r0,0,Math.PI*2); }
      else {
        // equal pitch from the dot to the outer reach; every arc and every gap is the same width
        const pitch = (R - r0)/(N-1), w = pitch*(50 + S.thick*4)/100, h = w/2;
        const rc = r0 + (pitch - w) + (k-2)*pitch + h;
        const rot = S.arcRot + S.twist*(k-1);
        for(const [d0,d1] of ARCS[(k-2)%ARCS.length]) arcShape(path, fx, fy, rc, h, (d0+rot)*Math.PI/180, (d1+rot)*Math.PI/180);
      }
      ctx.save(); ctx.clip(path);
      layer(k, Math.pow(1+S.scale/100,k-1), tw*(k-1));
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    return;
  }

  if(S.outside==='img'){ ctx.save(); layer(N, outerScale, tw*(N-1)); ctx.restore(); }

  // outermost ring first, largest magnification; each inner disc paints over it
  for(let k=N;k>=1;k--){
    const r = radius(k);
    ctx.save();
    ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.clip();
    ctx.fillStyle = S.bgCol; ctx.fillRect(0,0,W,H);
    layer(k, Math.pow(1+S.scale/100,k-1), tw*(k-1));
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  if(lw>0){
    ctx.strokeStyle = S.strokeCol; ctx.lineWidth = lw; ctx.lineCap = 'round';
    for(let k=1;k<=N;k++){
      const r = radius(k);
      ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.stroke();
    }
  }
}

// controls
const fmt = { blur:v=>(+v).toFixed(1)+' px', blurInc:v=>'+'+(+v).toFixed(2)+' px', arcRot:v=>v+'°', fade:v=>v+'%', pix:v=>(+v).toFixed(1)+' px', pixInc:v=>'+'+(+v).toFixed(1)+' px', rings:v=>v, centre:v=>Math.round(v*100)+'%', scale:v=>'+'+v+'%', reach:v=>Math.round(v*100)+'%', grow:v=>'+'+(+v).toFixed(1)+'%', twist:v=>(+v).toFixed(1)+'°', stroke:v=>(+v).toFixed(1)+' px' };
for(const key of Object.keys(fmt)){
  const el = $(key), out = $(key+'V');
  const sync = () => { S[key] = +el.value; out.textContent = fmt[key](el.value); draw(); };
  el.addEventListener('input', sync); out.textContent = fmt[key](el.value);
}
$('strokeCol').addEventListener('input', e => { S.strokeCol = e.target.value; draw(); });
$('bgCol').addEventListener('input', e => { S.bgCol = e.target.value; draw(); });
function setOutside(v){ S.outside = v; $('outImg').setAttribute('aria-pressed', v==='img'); $('outCol').setAttribute('aria-pressed', v==='col'); draw(); }
$('outImg').onclick = () => setOutside('img');
$('outCol').onclick = () => setOutside('col');
function syncSwatches(){ document.querySelectorAll('.sw').forEach(g => { const v = $(g.dataset.for).value.toLowerCase(); g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c.toLowerCase()===v)); }); }
document.querySelectorAll('.sw').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; const inp = $(g.dataset.for); inp.value = b.dataset.c.toLowerCase(); inp.dispatchEvent(new Event('input')); }));
['strokeCol','bgCol'].forEach(id => $(id).addEventListener('input', syncSwatches)); syncSwatches();
// Logo: width increase never applies. Circles: line weight and width increase exclude each other; whichever is above 0 locks the other.
function lock(ctlId, inputId, noteId, on, note){
  $(inputId).disabled = on; $(ctlId).classList.toggle('off', on);
  $(noteId).hidden = !on || !note; $(noteId).textContent = note || '';
}
function updateLocks(){
  if(S.ringStyle==='arcs'){ lock('growCtl','grow','growLock', true, 'Not used in Logo mode'); return; }
  lock('growCtl','grow','growLock', S.stroke > 0, 'Set ring line weight to 0 to use this');
  lock('strokeCtl','stroke','strokeLock', S.grow > 0, 'Set ring width increase to 0 to use this');
}
$('stroke').addEventListener('input', updateLocks);
$('grow').addEventListener('input', updateLocks);
function setStyle(v){ S.ringStyle = v; $('styArcs').setAttribute('aria-pressed', v==='arcs'); $('styCircle').setAttribute('aria-pressed', v==='circle'); $('arcCtl').hidden = v!=='arcs'; $('lineCtl').hidden = v==='arcs'; $('outSeg').hidden = v==='arcs'; updateLocks(); draw(); }
$('styArcs').onclick = () => setStyle('arcs');
$('styCircle').onclick = () => setStyle('circle');
setStyle(S.ringStyle);
$('recentre').onclick = () => { S.fx = .5; S.fy = .5; draw(); };

// focal drag
let dragging = false;
function setFocal(e){
  const b = cv.getBoundingClientRect();
  S.fx = Math.min(1,Math.max(0,(e.clientX-b.left)/b.width));
  S.fy = Math.min(1,Math.max(0,(e.clientY-b.top)/b.height));
  draw();
}
cv.addEventListener('pointerdown', e => { dragging = true; cv.setPointerCapture(e.pointerId); setFocal(e); });
cv.addEventListener('pointermove', e => { if(dragging) setFocal(e); });
cv.addEventListener('pointerup', () => dragging = false);

// loading images
function loadFile(f){
  if(!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f), i = new Image();
  i.onload = () => { setImage(i); URL.revokeObjectURL(url); };
  i.src = url;
}
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
const stage = $('stage');
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); stage.classList.add('drag'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('drag'); }));
document.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste', e => { const it = [...e.clipboardData.items].find(x => x.type.startsWith('image/')); if(it) loadFile(it.getAsFile()); });

// export
$('exportBtn').onclick = () => { cv.toBlob(b => { const u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'ripple-rings.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }, 'image/png'); };
$('closeOv').onclick = () => { $('overlay').hidden = true; };
$('overlay').addEventListener('click', e => { if(e.target.id==='overlay') $('overlay').hidden = true; });

(document.fonts ? document.fonts.ready : Promise.resolve()).then(sampleImage);
</script>
</body>
